[project]
name = "power-ml"
version = "0.1.0"
description = "Offline data + training pipeline for P.O.W.E.R."
requires-python = ">=3.12,<3.13"
dependencies = [
    "power-core",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.scripts]
power-ml = "power_ml.cli:app"

[tool.uv.sources]
power-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/power_ml"]
