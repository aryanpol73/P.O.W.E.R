# Maharashtra pilot (digital twin): the Pune pilot sites plus public chargers in Mumbai, Thane, Navi Mumbai,
# Nashik, Nagpur and Chhatrapati Sambhajinagar.
#
# * sites:     real charging locations from OpenStreetMap, named by OSM reverse geocoding (osm field).
#              Kolhapur and Solapur are not included: OpenStreetMap had no charger mapped there.
# * demand:    each site replays a paired training site's held-out demand on local wall-clock time.
#              There are more sites than training sites, so a training site can back several sites; each
#              reuse replays it from an earlier week (replay_offset_weeks) so no two sites show the same curve.
# * weather:   each site's own observed weather (Open-Meteo archive); holidays IN-MH; IST.
# * reports:   the held-out evaluation (Model Arena, Insights) is the Pune pilot sites' (`power-ml twin
#              --deployment pune`), where every training site backs exactly one site. Live accuracy covers
#              every Maharashtra site.
name: maharashtra
display_name: Maharashtra pilot (digital twin)
city: Maharashtra
country: India
timezone: Asia/Kolkata
holidays:
  country: IN
  subdiv: MH
currency: INR
locale: en-IN
model_source: palo_alto
donor_timezone: America/Los_Angeles
weather_cache: data/external/weather_maharashtra.parquet
reports: pune
