# Pune pilot (digital twin) deployment profile.
#
# The models are trained and evaluated on the Palo Alto (USA) public charging data; that is where
# every reported accuracy number comes from. This profile *deploys* those frozen models on Pune
# charging sites for the live console:
#
#   * sites:     real charging-station locations in Pune from OpenStreetMap (osm field), named by
#                locality via OSM reverse geocoding. Port counts and ratings are the paired
#                training site's, so the capacity assumption and alert thresholds keep their meaning.
#   * demand:    each Pune site replays the held-out demand of its paired training site ("donor"),
#                aligned on local wall-clock time (08:00 in Palo Alto becomes 08:00 IST), because
#                no public per-session Indian charging dataset exists to replay instead.
#   * weather:   Pune's own observed weather (Open-Meteo archive) at each site.
#   * calendar:  Indian + Maharashtra public holidays, Asia/Kolkata time zone.
#
# Consequence, stated in the UI: live accuracy on this console measures the models on a transferred
# demand profile, not on Indian drivers. Validating on Indian data is future work.
name: pune
display_name: Pune pilot (digital twin)
city: Pune
country: India
timezone: Asia/Kolkata
holidays: {country: IN, subdiv: MH}
currency: INR
locale: en-IN
model_source: palo_alto
donor_timezone: America/Los_Angeles
weather_cache: data/external/weather_pune.parquet

