# Model zoo configuration (report Chapter 5, Appendix B). Seeds fixed for reproducibility.
version: "2026.11.0"
seed: 42
n_jobs: -1

# Early stopping uses the *last part of the training block* (with an embargo), so the validation
# block stays untouched for ensemble weights and conformal calibration.
early_stopping:
  holdout_frac: 0.12
  embargo_hours: 168
  rounds: 100

# Origin sub-sampling per model (every k-th forecast origin) to keep training tractable.
# GBDTs use every origin; Ridge and RF are trained on sub-samples.
origin_stride:
  ridge: 6
  rf: 3
  xgb: 1
  lgbm: 1
  lgbm_quantile: 2
  tune: 6

ridge:
  alphas: [0.1, 1.0, 10.0, 100.0, 1000.0]

rf:
  n_estimators: 150
  max_depth: 18
  min_samples_leaf: 40
  max_features: 0.5
  max_samples: 0.25

xgb:
  objective: "reg:tweedie"
  tweedie_variance_power: 1.3
  n_estimators: 3000
  learning_rate: 0.05
  max_depth: 8
  min_child_weight: 5
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  reg_alpha: 0.0
  max_bin: 256

lgbm:
  objective: "tweedie"
  tweedie_variance_power: 1.3
  n_estimators: 3000
  learning_rate: 0.05
  num_leaves: 127
  min_child_samples: 100
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  reg_alpha: 0.0

lgbm_quantile:
  alphas: [0.05, 0.50, 0.95]
  n_estimators: 1500
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 200

monotone_increasing: [heat_stress, cold_stress]

tune:
  models: [lgbm, xgb]
  n_trials: 25
  timeout_s: 1200
  n_splits: 3
  embargo_hours: 168
  learning_rate: 0.1     # faster trials; final fit uses the configured learning rate

ensemble:
  members: [xgb, lgbm]

# M5 Seq2Seq LSTM (needs `uv sync --extra dl`; trained separately with `power-ml train-lstm`).
lstm:
  origin_stride: 2
  lookback: 168
  hidden: 64
  layers: 2
  dropout: 0.1
  emb: 8
  lr: 0.001
  batch_size: 512
  max_epochs: 20
  patience: 3
  max_minutes: 40
