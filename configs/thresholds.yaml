# Grid-risk thresholds. Single source of truth for the API, workers and UI colours.
# SYNTHETIC: transformer_kw = DF x sum(port nameplate kW). Default 1.0: EV chargers are continuous
# loads whose supply is sized at >= 125% of charger rating, so a transformer below nameplate is
# unlikely. Test-period sensitivity (share of hours a site is CRITICAL, 12 h lookahead):
# DF 0.85 -> HAMILTON 91%, HIGH 19%; DF 1.0 -> HAMILTON 50%, others 0%.
diversity_factor: 1.0
interval_level: 0.90
horizon_buckets: [[1, 3], [4, 12], [13, 24]]

alert:
  warning_raise: 0.70           # load_ratio_q95
  warning_clear: 0.65
  critical_raise: 0.85
  critical_clear: 0.80
  clear_consecutive: 2
  lookahead_hours: 12           # alerts consider the worst hour within the next N hours

map_colours:                    # by load_ratio_q50
  green_below: 0.50
  red_at_or_above: 0.85

reroute:
  radius_km: 3.0
  divertible_share: 0.30        # beta: share of excess demand assumed willing to move (assumption)
  target_safe_ratio: 0.70

aci:
  gamma: 0.005
  alpha_min: 0.01
  alpha_max: 0.50

drift:
  psi_threshold: 0.20
  page_hinkley_delta: 0.05
  page_hinkley_lambda: 50.0
  # A5 online drift agent (runs at each local midnight). Same detectors as the COVID stress test.
  cusum_k: 0.5                  # daily network bias, standardised by the validation reference
  cusum_h: 5.0
  window_hours: 168             # rolling window for PSI, coverage and WAPE ratio
  coverage_min: 0.85            # champion 90% interval coverage below this = signal
  wape_ratio_max: 1.25          # rolling champion WAPE / test WAPE above this = signal
  min_signals_for_retrain: 2

retrain:                        # A7 champion-challenger (LightGBM quantile only, frozen hyper-parameters)
  window_days: 365
  calib_days: 14
  shadow_days: 7
  embargo_hours: 24
  wape_gain: 0.98
  picp_low: 0.87
  picp_high: 0.93
  max_station_regression: 0.10
